version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attachment-summarizer
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/attachment_summarizer
      - REDIS_URL=redis://redis:6379
      - OLLAMA_BASE_URL=http://ollama:11434
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      ollama:
        condition: service_started
    networks:
      - attachment-summarizer-network

  db:
    image: postgres:15-alpine
    container_name: attachment-summarizer-db
    restart: unless-stopped
    environment:
      - POSTGRES postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=attachment_summarizer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - attachment-summarizer-network

  redis:
    image: redis:7-alpine
    container_name: attachment-summarizer-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - attachment-summarizer-network

  ollama:
    image: ollama/ollama:latest
    container_name: attachment-summarizer-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - attachment-summarizer-network

volumes:
  postgres_data:
  ollama_data:

networks:
  attachment-summarizer-network:
    driver: bridge